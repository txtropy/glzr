general:
  # Commands to run when the WM has started. This is useful for running a
  # script or launching another application.
  # Example: The below command launches Zebar.
  startup_commands: ['shell-exec zebar']

  # Commands to run just before the WM is shutdown.
  # Example: The below command kills Zebar.
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']

  # Commands to run after the WM config is reloaded.
  config_reload_commands: []

  # Whether to automatically focus windows underneath the cursor.
  focus_follows_cursor: false

  # Whether to switch back and forth between the previously focused
  # workspace when focusing the current workspace.
  toggle_workspace_on_refocus: false

  cursor_jump:
    # Whether to automatically move the cursor on the specified trigger.
    enabled: true

    # Trigger for cursor jump:
    # - 'monitor_focus': Jump when focus changes between monitors.
    # - 'window_focus': Jump when focus changes between windows.
    trigger: 'monitor_focus'

  # How windows should be hidden when switching workspaces.
  # - 'cloak': (Windows-only) Recommended option for Windows.
  # - 'hide': (Windows-only) Legacy option for Windows. Has stability issues with some apps.
  # - 'place_in_corner': Artifically hides the window by placing it in the corner of the
  #   monitor. On macOS, this is always used instead of cloak/hide.
  hide_method: 'cloak'

  # Affects which windows get shown in the native Windows taskbar. Has no
  # effect if `hide_method: 'hide'`.
  # - 'true': Show all windows (regardless of workspace).
  # - 'false': Only show windows from the currently shown workspaces.
  show_all_in_taskbar: false

gaps:
  # Whether to scale the gaps with the DPI of the monitor.
  scale_with_dpi: true

  # Gap between adjacent windows.
  inner_gap: '5px'

  # Gap between windows and the screen edge.
  outer_gap:
    top: '45px'      # room for the Zebar bar
    right: '10px'
    bottom: '10px'
    left: '10px'

window_effects:
  # Theme: Nord. Focused border = Nord8 #88C0D0, other borders = Nord3 #4C566A.
  # Visual effects to apply to the focused window.
  focused_window:
    # Highlight the window with a colored border.
    # ** Exclusive to Windows 11 due to API limitations.
    border:
      enabled: true
      color: '#88C0D0'

    # Remove the title bar from the window's frame. Note that this can
    # cause rendering issues for some applications.
    hide_title_bar:
      enabled: false

    # Change the corner style of the window's frame.
    # ** Exclusive to Windows 11 due to API limitations.
    corner_style:
      enabled: true
      # Allowed values: 'square', 'rounded', 'small_rounded'.
      style: 'square'

    # Change the transparency of the window.
    transparency:
      enabled: false
      # Can be something like '95%' or '0.95' for slightly transparent windows.
      # '0' or '0%' is fully transparent (and, by consequence, unfocusable).
      opacity: '95%'

  # Visual effects to apply to non-focused windows.
  other_windows:
    border:
      enabled: true
      color: '#4C566A'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'
    transparency:
      enabled: false
      opacity: '90%'

window_behavior:
  # New windows are created in this state whenever possible.
  # Allowed values: 'tiling', 'floating'.
  initial_state: 'tiling'

  # Sets the default options for when a new window is created. This also
  # changes the defaults for when the state change commands, like
  # `set-floating`, are used without any flags.
  state_defaults:
    floating:
      # Whether to center floating windows by default.
      centered: true

      # Whether to show floating windows as always on top.
      shown_on_top: false

    fullscreen:
      # Maximize the window if possible. If the window doesn't have a
      # maximize button, then it'll be fullscreen'ed normally instead.
      maximized: false

      # Whether to show fullscreen windows as always on top.
      shown_on_top: false

# Role-based workspaces. No bind_to_monitor on purpose: monitor indexes are not stable.
workspaces:
  # For coding environment: 1 VSCode instance (+ an optional terminal app).
  - name: 'code1'
  - name: 'code2'
  - name: 'code3'

  # For browsers
  - name: 'web1'
  - name: 'web2'

  # For dev tools (DBMS, API platform, etc.)
  - name: 'tools1'
  - name: 'tools2'
  - name: 'tools3'

  # Teams/Slack, meeting app
  - name: 'chat'

  # OS utilities: File Explorer, Task Manager
  - name: 'utils'

  # Note-taking
  - name: 'notes'

  # Music
  - name: 'media'

  # Miscellaneous
  - name: 'other'

  # Scratch workspaces: for things you have not named yet.
  - name: '0'
    display_name: '[0]'
  - name: '1'
    display_name: '[1]'
  - name: '2'
    display_name: '[2]'
  - name: '3'
    display_name: '[3]'
  - name: '4'
    display_name: '[4]'
  - name: '5'
    display_name: '[5]'
  - name: '6'
    display_name: '[6]'
  - name: '7'
    display_name: '[7]'
  - name: '8'
    display_name: '[8]'
  - name: '9'
    display_name: '[9]'

# Rules run top to bottom. Find real values with:
#   glazewm query windows | ConvertFrom-Json | % { $_.data.windows } | Select processName, className, title
window_rules:
  # 1) Ignore: overlays and helper windows GlazeWM should never manage.
  - commands: ['ignore']
    match:
      # Ignores any Zebar windows.
      - window_process: { equals: 'zebar' }

      # Ignores picture-in-picture windows for browsers.
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

      # Ignore rules for various 3rd-party apps.
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

  # 2) Float: dialogs and transient windows that would otherwise split the layout.
  # - commands: ['set-floating --centered']
  #   match:
      # SSMS connection dialogs. Verify title/process with the query above.
      # - window_process: { equals: 'Ssms' }
      #   window_title: { regex: 'Connect to (Server|Database Engine)' }

  # 3) Place: apps that always belong to one workspace.
  - commands: ['move --workspace code1']
    match:
      - window_process: { equals: 'Code' }

  - commands: ['move --workspace web1']
    match:
      - window_process: { regex: '(?i)^(chrome|msedge|firefox)$' }

  - commands: ['move --workspace tools1']
    match:
      - window_process: { regex: '(?i)^(ssms|storageexplorer|servicebusexplorer)$' }

  - commands: ['move --workspace chat']
    match:
      - window_process: { regex: '(?i)^(ms-teams)$' }

  - commands: ['move --workspace media']
    match:
      - window_process: { regex: '(?i)^(Spotify)$' }

  - commands: ['move --workspace utils']
    match:
      - window_process: { regex: '(?i)^(explorer)$' }

binding_modes:
  # alt+r: resize with h/j/k/l or arrows.
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      # Press enter/escape to return to default keybindings.
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']
 
  # alt+g, then: c / w / t and a number (code / web / tools N),
  # h = chat, u = utils, n = notes, m = media, o = other,
  # space = demo, or a digit 0-9 for a scratch workspace.
  - name: 'goto'
    keybindings:
      - commands: ['wm-disable-binding-mode --name goto', 'wm-enable-binding-mode --name goto-code']
        bindings: ['c']
      - commands: ['wm-disable-binding-mode --name goto', 'wm-enable-binding-mode --name goto-web']
        bindings: ['w']
      - commands: ['wm-disable-binding-mode --name goto', 'wm-enable-binding-mode --name goto-tools']
        bindings: ['t']
      - commands: ['focus --workspace chat', 'wm-disable-binding-mode --name goto']
        bindings: ['h']
      - commands: ['focus --workspace utils', 'wm-disable-binding-mode --name goto']
        bindings: ['u']
      - commands: ['focus --workspace notes', 'wm-disable-binding-mode --name goto']
        bindings: ['n']
      - commands: ['focus --workspace media', 'wm-disable-binding-mode --name goto']
        bindings: ['m']
      - commands: ['focus --workspace other', 'wm-disable-binding-mode --name goto']
        bindings: ['o']
      - commands: ['focus --workspace 0', 'wm-disable-binding-mode --name goto']
        bindings: ['0']
      - commands: ['focus --workspace 1', 'wm-disable-binding-mode --name goto']
        bindings: ['1']
      - commands: ['focus --workspace 2', 'wm-disable-binding-mode --name goto']
        bindings: ['2']
      - commands: ['focus --workspace 3', 'wm-disable-binding-mode --name goto']
        bindings: ['3']
      - commands: ['focus --workspace 4', 'wm-disable-binding-mode --name goto']
        bindings: ['4']
      - commands: ['focus --workspace 5', 'wm-disable-binding-mode --name goto']
        bindings: ['5']
      - commands: ['focus --workspace 6', 'wm-disable-binding-mode --name goto']
        bindings: ['6']
      - commands: ['focus --workspace 7', 'wm-disable-binding-mode --name goto']
        bindings: ['7']
      - commands: ['focus --workspace 8', 'wm-disable-binding-mode --name goto']
        bindings: ['8']
      - commands: ['focus --workspace 9', 'wm-disable-binding-mode --name goto']
        bindings: ['9']
      - commands: ['wm-disable-binding-mode --name goto']
        bindings: ['escape']
 
  # second key of the goto chord: which code workspace.
  - name: 'goto-code'
    keybindings:
      - commands: ['focus --workspace code1', 'wm-disable-binding-mode --name goto-code']
        bindings: ['1']
      - commands: ['focus --workspace code2', 'wm-disable-binding-mode --name goto-code']
        bindings: ['2']
      - commands: ['focus --workspace code3', 'wm-disable-binding-mode --name goto-code']
        bindings: ['3']
      - commands: ['wm-disable-binding-mode --name goto-code']
        bindings: ['escape']
 
  # second key of the goto chord: which web workspace.
  - name: 'goto-web'
    keybindings:
      - commands: ['focus --workspace web1', 'wm-disable-binding-mode --name goto-web']
        bindings: ['1']
      - commands: ['focus --workspace web2', 'wm-disable-binding-mode --name goto-web']
        bindings: ['2']
      - commands: ['wm-disable-binding-mode --name goto-web']
        bindings: ['escape']
 
  # second key of the goto chord: which tools workspace.
  - name: 'goto-tools'
    keybindings:
      - commands: ['focus --workspace tools1', 'wm-disable-binding-mode --name goto-tools']
        bindings: ['1']
      - commands: ['focus --workspace tools2', 'wm-disable-binding-mode --name goto-tools']
        bindings: ['2']
      - commands: ['focus --workspace tools3', 'wm-disable-binding-mode --name goto-tools']
        bindings: ['3']
      - commands: ['wm-disable-binding-mode --name goto-tools']
        bindings: ['escape']
 
  # alt+shift+g, then the same keys as above: send the focused window there.
  - name: 'send'
    keybindings:
      - commands: ['wm-disable-binding-mode --name send', 'wm-enable-binding-mode --name send-code']
        bindings: ['c']
      - commands: ['wm-disable-binding-mode --name send', 'wm-enable-binding-mode --name send-web']
        bindings: ['w']
      - commands: ['wm-disable-binding-mode --name send', 'wm-enable-binding-mode --name send-tools']
        bindings: ['t']
      - commands: ['move --workspace chat', 'focus --workspace chat', 'wm-disable-binding-mode --name send']
        bindings: ['h']
      - commands: ['move --workspace utils', 'focus --workspace utils', 'wm-disable-binding-mode --name send']
        bindings: ['u']
      - commands: ['move --workspace notes', 'focus --workspace notes', 'wm-disable-binding-mode --name send']
        bindings: ['n']
      - commands: ['move --workspace media', 'focus --workspace media', 'wm-disable-binding-mode --name send']
        bindings: ['m']
      - commands: ['move --workspace other', 'focus --workspace other', 'wm-disable-binding-mode --name send']
        bindings: ['o']
      - commands: ['move --workspace 0', 'focus --workspace 0', 'wm-disable-binding-mode --name send']
        bindings: ['0']
      - commands: ['move --workspace 1', 'focus --workspace 1', 'wm-disable-binding-mode --name send']
        bindings: ['1']
      - commands: ['move --workspace 2', 'focus --workspace 2', 'wm-disable-binding-mode --name send']
        bindings: ['2']
      - commands: ['move --workspace 3', 'focus --workspace 3', 'wm-disable-binding-mode --name send']
        bindings: ['3']
      - commands: ['move --workspace 4', 'focus --workspace 4', 'wm-disable-binding-mode --name send']
        bindings: ['4']
      - commands: ['move --workspace 5', 'focus --workspace 5', 'wm-disable-binding-mode --name send']
        bindings: ['5']
      - commands: ['move --workspace 6', 'focus --workspace 6', 'wm-disable-binding-mode --name send']
        bindings: ['6']
      - commands: ['move --workspace 7', 'focus --workspace 7', 'wm-disable-binding-mode --name send']
        bindings: ['7']
      - commands: ['move --workspace 8', 'focus --workspace 8', 'wm-disable-binding-mode --name send']
        bindings: ['8']
      - commands: ['move --workspace 9', 'focus --workspace 9', 'wm-disable-binding-mode --name send']
        bindings: ['9']
      - commands: ['wm-disable-binding-mode --name send']
        bindings: ['escape']
 
  # second key of the send chord: which code workspace.
  - name: 'send-code'
    keybindings:
      - commands: ['move --workspace code1', 'focus --workspace code1', 'wm-disable-binding-mode --name send-code']
        bindings: ['1']
      - commands: ['move --workspace code2', 'focus --workspace code2', 'wm-disable-binding-mode --name send-code']
        bindings: ['2']
      - commands: ['move --workspace code3', 'focus --workspace code3', 'wm-disable-binding-mode --name send-code']
        bindings: ['3']
      - commands: ['wm-disable-binding-mode --name send-code']
        bindings: ['escape']
 
  # second key of the send chord: which web workspace.
  - name: 'send-web'
    keybindings:
      - commands: ['move --workspace web1', 'focus --workspace web1', 'wm-disable-binding-mode --name send-web']
        bindings: ['1']
      - commands: ['move --workspace web2', 'focus --workspace web2', 'wm-disable-binding-mode --name send-web']
        bindings: ['2']
      - commands: ['wm-disable-binding-mode --name send-web']
        bindings: ['escape']
 
  # second key of the send chord: which tools workspace.
  - name: 'send-tools'
    keybindings:
      - commands: ['move --workspace tools1', 'focus --workspace tools1', 'wm-disable-binding-mode --name send-tools']
        bindings: ['1']
      - commands: ['move --workspace tools2', 'focus --workspace tools2', 'wm-disable-binding-mode --name send-tools']
        bindings: ['2']
      - commands: ['move --workspace tools3', 'focus --workspace tools3', 'wm-disable-binding-mode --name send-tools']
        bindings: ['3']
      - commands: ['wm-disable-binding-mode --name send-tools']
        bindings: ['escape']
 

keybindings:
  # Shift focus in a given direction.
  - commands: ['focus --direction left']
    bindings: ['alt+h']
  - commands: ['focus --direction right']
    bindings: ['alt+l']
  - commands: ['focus --direction up']
    bindings: ['alt+k']
  - commands: ['focus --direction down']
    bindings: ['alt+j']

  # Move focused window in a given direction.
  # Use win+shift instead (cause alt+shift conflicts with my other keybindings)
  - commands: ['move --direction left']
    bindings: ['win+shift+h']
  - commands: ['move --direction right']
    bindings: ['win+shift+l']
  - commands: ['move --direction up']
    bindings: ['win+shift+k']
  - commands: ['move --direction down']
    bindings: ['win+shift+j']

  # Workspace leader keys.
  - commands: ['wm-enable-binding-mode --name goto']
    bindings: ['alt+g']
  - commands: ['wm-enable-binding-mode --name send']
    bindings: ['alt+shift+g']

  # Resize focused window by a percentage or pixel amount.
  - commands: ['resize --width -2%']
    bindings: ['alt+u']
  - commands: ['resize --width +2%']
    bindings: ['alt+p']
  - commands: ['resize --height +2%']
    bindings: ['alt+o']
  - commands: ['resize --height -2%']
    bindings: ['alt+i']

  # As an alternative to the resize keybindings above, resize mode enables
  # resizing via arrow keys or HJKL. The binding mode is defined above with
  # the name 'resize'.
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']

  # Panic/Recovery

  # Disables window management and all other keybindings until alt+shift+p is pressed again.
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']

  # Re-evaluate configuration file.
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']

  # Redraw all windows.
  - commands: ['wm-redraw']
    bindings: ['alt+shift+w']

  # Layout and window state.
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+v']

  # Change focus from tiling windows -> floating -> fullscreen.
  - commands: ['wm-cycle-focus']
    bindings: ['alt+space']

  # Change the focused window to be floating.
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']

  # Change the focused window to be tiling.
  - commands: ['toggle-tiling']
    bindings: ['alt+t']

  # Change the focused window to be fullscreen.
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']

  # Minimize focused window.
  - commands: ['toggle-minimized']
    bindings: ['alt+m']

  # Close focused window.
  - commands: ['close']
    bindings: ['alt+shift+q']

  # Kill GlazeWM process safely
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']

  # Launch CMD terminal. Alternatively, use `shell-exec wt` or
  # `shell-exec %ProgramFiles%/Git/git-bash.exe` to start Windows
  # Terminal and Git Bash respectively.
  - commands: ['shell-exec wt']
    bindings: ['alt+enter']

  # Focus the next/previous active workspace defined in `workspaces` config.
  - commands: ['focus --next-active-workspace']
    bindings: ['alt+s']
  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+a']

  # Focus the workspace that last had focus.
  - commands: ['focus --recent-workspace']
    bindings: ['alt+z']

  # Move the focused workspace to the monitor in a direction.
  - commands: ['move-workspace --direction left']
    bindings: ['alt+shift+a']
  - commands: ['move-workspace --direction right']
    bindings: ['alt+shift+f']
  - commands: ['move-workspace --direction up']
    bindings: ['alt+shift+d']
  - commands: ['move-workspace --direction down']
    bindings: ['alt+shift+s']